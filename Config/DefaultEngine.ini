; Fofuxo -- the trail from the Portuguese names to the English ones.
;
; The plugin's identifiers were translated in one pass. Struct, enum, class and
; property names are what Unreal writes into the asset file, so without these
; redirects an IK Retargeter saved before the translation would open with an
; unresolved op -- the attachment list gone, with a warning -- and a saved pose
; asset would come back empty.
;
; Nothing here expires: an asset resaved after the translation no longer needs
; its line, but a project that still has an old one does, and there is no telling
; which from here.

[CoreRedirects]

; -- The attachments op, which lives inside the UIKRetargeter --------------------

+StructRedirects=(OldName="FofuxoAnexosOp", NewName="FofuxoAttachmentsOp")
+StructRedirects=(OldName="FofuxoAnexosOpSettings", NewName="FofuxoAttachmentsOpSettings")
+StructRedirects=(OldName="FofuxoAnexo", NewName="FofuxoAttachment")

+PropertyRedirects=(OldName="FofuxoAttachmentsOpSettings.Anexos", NewName="Attachments")
+PropertyRedirects=(OldName="FofuxoAttachment.bMostrar", NewName="bShow")
+PropertyRedirects=(OldName="FofuxoAttachment.Boneco", NewName="Character")
+PropertyRedirects=(OldName="FofuxoAttachment.OssoNaFonte", NewName="SourceBone")
+PropertyRedirects=(OldName="FofuxoAttachment.OssoNoAlvo", NewName="TargetBone")
+PropertyRedirects=(OldName="FofuxoAttachment.Deslocamento", NewName="Offset")
+PropertyRedirects=(OldName="FofuxoAttachment.Encaixe", NewName="PreviewFit")
+PropertyRedirects=(OldName="FofuxoAttachment.Eixo", NewName="Axis")

; The same, keyed by the old struct name: which of the two the redirect engine
; matches depends on the order it resolves them in, and a spare line costs
; nothing.
+PropertyRedirects=(OldName="FofuxoAnexosOpSettings.Anexos", NewName="Attachments")
+PropertyRedirects=(OldName="FofuxoAnexo.bMostrar", NewName="bShow")
+PropertyRedirects=(OldName="FofuxoAnexo.Boneco", NewName="Character")
+PropertyRedirects=(OldName="FofuxoAnexo.OssoNaFonte", NewName="SourceBone")
+PropertyRedirects=(OldName="FofuxoAnexo.OssoNoAlvo", NewName="TargetBone")
+PropertyRedirects=(OldName="FofuxoAnexo.Deslocamento", NewName="Offset")
+PropertyRedirects=(OldName="FofuxoAnexo.Encaixe", NewName="PreviewFit")
+PropertyRedirects=(OldName="FofuxoAnexo.Eixo", NewName="Axis")

; -- The two enums saved inside those rows ---------------------------------------

+EnumRedirects=(OldName="EFofuxoBoneco", NewName="EFofuxoCharacter", ValueChanges=(("EFofuxoBoneco::Fonte","EFofuxoCharacter::Source"),("EFofuxoBoneco::Alvo","EFofuxoCharacter::Target"),("EFofuxoBoneco::Ambos","EFofuxoCharacter::Both")))

+EnumRedirects=(OldName="EFofuxoEixoDoMundo", NewName="EFofuxoWorldAxis", ValueChanges=(("EFofuxoEixoDoMundo::MaisX","EFofuxoWorldAxis::PlusX"),("EFofuxoEixoDoMundo::MenosX","EFofuxoWorldAxis::MinusX"),("EFofuxoEixoDoMundo::MaisY","EFofuxoWorldAxis::PlusY"),("EFofuxoEixoDoMundo::MenosY","EFofuxoWorldAxis::MinusY"),("EFofuxoEixoDoMundo::MaisZ","EFofuxoWorldAxis::PlusZ"),("EFofuxoEixoDoMundo::MenosZ","EFofuxoWorldAxis::MinusZ")))

; -- The pose asset --------------------------------------------------------------

+ClassRedirects=(OldName="FofuxoPoseDeRetarget", NewName="FofuxoRetargetPose")

+PropertyRedirects=(OldName="FofuxoRetargetPose.Observacao", NewName="Note")
+PropertyRedirects=(OldName="FofuxoRetargetPose.RotacoesLocais", NewName="LocalRotations")
+PropertyRedirects=(OldName="FofuxoRetargetPose.DeslocamentoDoPelvis", NewName="PelvisOffset")
+PropertyRedirects=(OldName="FofuxoRetargetPose.OssosPosados", NewName="PosedBones")
+PropertyRedirects=(OldName="FofuxoRetargetPose.Malha", NewName="Mesh")
+PropertyRedirects=(OldName="FofuxoRetargetPose.Esqueleto", NewName="Skeleton")
+PropertyRedirects=(OldName="FofuxoRetargetPose.Lado", NewName="Side")
+PropertyRedirects=(OldName="FofuxoRetargetPose.NomeDaPose", NewName="PoseName")
+PropertyRedirects=(OldName="FofuxoRetargetPose.Quando", NewName="When")

+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.Observacao", NewName="Note")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.RotacoesLocais", NewName="LocalRotations")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.DeslocamentoDoPelvis", NewName="PelvisOffset")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.OssosPosados", NewName="PosedBones")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.Malha", NewName="Mesh")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.Esqueleto", NewName="Skeleton")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.Lado", NewName="Side")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.NomeDaPose", NewName="PoseName")
+PropertyRedirects=(OldName="FofuxoPoseDeRetarget.Quando", NewName="When")
